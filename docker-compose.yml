name: clirace

services:
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;", "-c", "/opt/clirace/nginx/nginx.conf"]
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./infra/nginx:/opt/clirace/nginx:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_BODY_LIMIT_BYTES: ${HTTP_BODY_LIMIT_BYTES:-65536}
      DATABASE_URL: postgresql://${POSTGRES_USER:-clirace}:${POSTGRES_PASSWORD:-change-me-before-production}@postgres:5432/${POSTGRES_DB:-clirace}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-before-production}@redis:6379
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-clirace_session}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-604800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BATTLE_COUNTDOWN_MS: ${BATTLE_COUNTDOWN_MS:-3000}
      BATTLE_RECONNECT_GRACE_SECONDS: ${BATTLE_RECONNECT_GRACE_SECONDS:-60}
      BATTLE_WAITING_TTL_SECONDS: ${BATTLE_WAITING_TTL_SECONDS:-1800}
      BATTLE_MAX_LIFETIME_SECONDS: ${BATTLE_MAX_LIFETIME_SECONDS:-1800}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clirace}
      POSTGRES_USER: ${POSTGRES_USER:-clirace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    user: redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save \"\" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-before-production}
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
