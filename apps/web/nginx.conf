map $request_uri $clirace_robots_tag {
  default "";
  ~^/admin(?:[/?]|$) "noindex, nofollow";
  ~^/battle(?:[/?]|$) "noindex, nofollow";
  ~^/(?:login|register)(?:[/?]|$) "noindex, follow";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Robots-Tag $clirace_robots_tag always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok\n';
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ^~ /admin {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

