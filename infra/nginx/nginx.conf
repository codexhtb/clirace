worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main 'rid=$request_id $remote_addr - $request_method $uri $status $body_bytes_sent '
                  'rt=$request_time ua="$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 1m;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Preserve HTTPS information from a trusted host-level reverse proxy (Caddy),
  # while keeping direct SSH-tunnel access working over plain HTTP.
  map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  # Host-level Caddy reaches this container through the Docker bridge gateway.
  # Trust client IP information only from that gateway.
  set_real_ip_from 172.19.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream web_upstream {
    server web:80;
    keepalive 16;
  }

  upstream api_upstream {
    server api:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok\n';
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      # The edge gateway is authoritative for browser-facing security and trace headers.
      proxy_hide_header X-Request-ID;
      proxy_hide_header X-Content-Type-Options;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Referrer-Policy;
      proxy_hide_header Cross-Origin-Opener-Policy;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $client_scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    # Authenticated terminal gateway for disposable rootless sandboxes.
    location /ws/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $client_scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
      proxy_read_timeout 960s;
      proxy_send_timeout 30s;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $client_scheme;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
